# 1. Conexión a la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/eduplan_db
spring.datasource.username=postgres
spring.datasource.password=EduPlan_5123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# Flyway owns the schema; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=${DB_BASELINE_EXISTING:false}
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true

eduplan.data-integration.base-url=${DATA_INTEGRATION_BASE_URL:http://localhost:3001}
eduplan.data-integration.page-size=${DATA_INTEGRATION_PAGE_SIZE:100}
eduplan.data-integration.max-pages=${DATA_INTEGRATION_MAX_PAGES:5000}
eduplan.data-integration.connect-timeout-ms=3000
eduplan.data-integration.read-timeout-ms=15000
# Empty by default: all synchronization requests are denied until a token is set.
eduplan.data-integration.admin-token=${DATA_SYNC_ADMIN_TOKEN:}
